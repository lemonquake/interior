# Sleep's online lobby (game/scripts/coop/lobby_net.gd): who is online, the games they host, the lobby chat.
# Anonymous on purpose (the game has no accounts); only the game's own topics can be used.
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous true
acl_file /etc/mosquitto/sleep.acl
max_connections 1000
message_size_limit 8192
max_keepalive 120
